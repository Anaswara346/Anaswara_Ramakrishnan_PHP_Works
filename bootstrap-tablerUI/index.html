<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <!-- Bootstrap including using CDN [Content Delivery Network] -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- Tabler UI open-source admin dasboard UI kit made with Bootstrap 5  -->
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css"
        rel="stylesheet">
</head>
<body>
    <!-- Table sidebar  vertical navigation panel-->
    <aside class="navbar navbar-vertical navbar-expand-lg">
        <div class="container-fluid">
            <h2>My Dashboard</h2>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        Users
                    </a>
                </li>
            </ul>
        </div>
    </aside>
    <!-- Navabr -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a href="#" class="navbar-brand">Logo</a>

            <button class="navbar-toggler"
                    data-bs-toggle="collapse"
                    data-bs-target="#myNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="myNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="#" class="nav-link">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>  
    
    <div class="container">
        <div class="row">
            <div class="col-4">
                Box 1
            </div>
            <div class="col-4">
                Box 2
            </div>
            <div class="col-4">
                Box 3
            </div>
        </div>

        <button class="btn btn-primary">Save</button>
        <button class="btn btn-success">Submit</button>
        <button class="btn btn-danger">Delete</button>
        <button class="btn btn-warning">Warnings</button>
        <button class="btn btn-outline-primary">Cancel</button>
        <button class="btn btn-info">Warnings</button>
    </div>

    <div class="card" style="width: 18rem;"> 
        <div class="card-body">
            <h5 class="card-title">Total Users</h5>
            <p class="card-text">
                125 registered users.
            </p>
            <button class="btn btn-primary">
                View Users
            </button>
            <h5 class="card-footer"> footer</h5>
        </div>
    </div>

    <div class="p-5 mt-3 mb-2">
        Content
    </div>

    <div class="alert alert-success">
        User added successfully
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js">
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
