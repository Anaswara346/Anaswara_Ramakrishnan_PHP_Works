<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Box Pattern</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- custom css -->
     <link rel="stylesheet" href="style.css">

</head>
<body>
    <h3 class="p-4 mb-4 
                text-dark rounded 
                shadow text-center">
        Bootstrap Box Layout</h3>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="box p-4 bg-primary text-white rounded text-center">
                    <h4>Box 1</h4>
                    <p>Welcome to Bootstrap</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="box p-4 bg-success text-white rounded text-center">
                    <h4>Box 2</h4>
                    <p>Grid System </p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="box p-4 bg-warning text-white rounded text-center">
                    <h4>Box 3</h4>
                    <p>Responsive Design</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="box p-4 bg-info text-white rounded text-center">
                    <h4>Box 4</h4>
                    <p>Bootstrap cards</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="box p-4 bg-danger text-white rounded text-center">
                    <h4>Box 5</h4>
                    <p>Spacing Utilities</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-4">
                <div class="box p-4 bg-dark text-white rounded text-center">
                    <h4>Box 6</h4>
                    <p>Bootstrap Components</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
