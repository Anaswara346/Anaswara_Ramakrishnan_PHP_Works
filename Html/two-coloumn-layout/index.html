<!DOCTYPE html>
<html>
<head>
    <title>Two Column Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="container">

        <div class="text-content">
            <h1>Welcome to My Profile</h1>

            <p>
                I am a passionate Computer Science postgraduate
                interested in web development and programming.
                I enjoy learning new technologies and building
                creative projects.
            </p>

            <button type="button" onclick="alert('Welcome to my Profile')">Learn More</button>
        </div>

        <div class="image-content">
            <img src="profile.png" alt="Profile image">
        </div>

    </section>

</body>
</html>
