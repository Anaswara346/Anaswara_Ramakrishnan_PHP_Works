<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="counter-container">
        <h1>Counter App</h1>
        <span id="count">0</span>   <!-- to display the counter value -->

        <div class="button">
            <button id="decrease">-</button>
            <button id="reset">Reset</button>
            <button id="increase">+</button>
            <button id="increasefive">+5</button>
        </div>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!-- We use the id beacause the javascript needs a way to identify and acess particular HTML elements. -->
