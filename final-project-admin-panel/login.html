<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">

    <!-- login container -->
    <div class="bg-white w-full max-w-md p-8 rounded-xl shadowm-sm border border-gray-200">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-user-shield text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">
                Welcome Back
            </h1>
            <p class="text-gray-500 text-sm mt-2">
                Login to your account
            </p>
        </div>
        <!-- login form -->
        <form id="loginForm" class="space-y-5">
            <!-- email -->
            <div>
                <label for="loginEmail"
                        class="block text-sm font-medium text-gray-700 mb-2">
                        Email Address
                </label>
                <input type="email" id="loginEmail"
                        placeholder="Enter your email"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 
                                focus:ring-blue-500 focus:border-blue-500 
                        transition">
            </div>

            <div>
                <!-- password -->
                <label for="loginPassword"
                    class="block text-sm font-medium text-gray-700 mb-2">
                    Password
                </label>
                <input type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 
                        focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                        transition">
            </div>
             <!-- Remember Me -->
            <div class="flex items-center justify-between">

                <label class="flex items-center gap-2 text-sm text-gray-600">

                    <input
                        type="checkbox"
                        id="rememberMe"
                        class="w-4 h-4 accent-blue-600">
                    Remember me
                </label>
                <a href="#"
                    class="text-sm text-blue-600 hover:underline">
                    Forgot Password?
                </a>
            </div>
            <!-- error message -->
            <p id="loginError" class="text-sm text-red-600 hidden"></p>

            <!-- login button -->
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg
                            transition duration-200">
                    Login
            </button>
        </form>
        <!-- Register Link -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-600">
                Don't have an account ?
            </p>
            <a href="register.html"
                class="text-blue-600 font-semibold hover:underline">
                Sign Up
            </a>
        </div>

    </div>
    <script src="auth.js"></script>
</body>
</html>
