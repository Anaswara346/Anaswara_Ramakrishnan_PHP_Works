<!DOCTYPE html>
<html lang="en" class="overscroll-none">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-gray-100">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
       <aside id="sidebar"
                class="fixed lg:static top-0 left-0 z-50 bg-gray-800 
                        text-white min-h-screen transition -translate-x-full lg:translate-x-0 
                        transition-transform duration-300 w-64">
            <div class="p-6 flex items-center justify-between">
                <h1 class="text-white font-semibold text-2xl">
                    Admin Panel
                </h1>
                <button id="closeSidebar"
                    class="lg:hidden text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="space-y-2 px-3 mt-6">

                <a href="dashboard.html"
                    class="block px-4 py-3 text-white hover:bg-gray-600 rounded-lg transition">
                    <i class="fa-solid fa-house w-5"></i>
                    Dashboard
                </a>

                <a href="users.html"
                    class="block px-4 py-3 bg-blue-600 rounded-lg">
                    <i class="fa-solid fa-users w-5"></i>
                    Users
                </a>

                <a href="adduser.html"
                    class="block px-4 py-3 text-white hover:bg-gray-600 rounded-lg transition">
                    <i class="fa-solid fa-user-plus w-5"></i>
                    Add User
                </a>
                <a href="profile.html"
                    class="block px-4 py-3 text-white hover:bg-gray-600 rounded-lg transition">
                    <i class="fa-solid fa-user-circle w-5"></i>
                    My Profile
                </a>
                <a href="#" id="logoutBtn"
                    class="block px-4 py-3 text-white hover:bg-red-600 rounded-lg transition">
                    <i class="fa-solid fa-right-from-bracket w-5"></i>
                    Logout
                </a>

            </nav>

        </aside>


        <!-- Main Content -->
        <main class="flex-1 p-6">

            <!-- Page Header -->
            <header class="bg-white p-5 rounded-lg shadow-sm mb-8 flex items-center gap-4">
                <!-- Hamburger Button -->
                <button id="openSidebar"
                        class="lg:hidden text-gray-700 text-xl">
                        <i class="fa-solid fa-bars"></i>

                </button>
                <h2 class="text-2xl font-semibold text-gray-800">
                    User Management
                </h2>
                <p class="text-gray-500 text-sm mt-1">
                    Manage and monitor all registered users.
                </p>
            </header>
        

            <!-- User Management Section -->
            <section class="bg-white rounded-lg shadow-sm border border-gray-200">

                <!-- Section Header -->
                <div class="p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-gray-200">

                    <div>
                        <h3 class="text-lg font-semibold text-gray-800">
                            All Users
                        </h3>

                        <p class="text-sm text-gray-500 mt-1">
                            View, search and manage user details.
                        </p>
                    </div>


                    <!-- Search and Add Button -->
                    
                    <div class="flex flex-col lg:flex-row gap-3 w-full">

                        <!-- Search -->
                        <div class="relative flex-1">

                            <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>

                            <input
                                type="text"
                                id="searchUser"
                                placeholder="Search users..."
                                class="border border-gray-300 rounded-lg pl-10 pr-4 py-2.5 w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">

                        </div>

                        <!-- Role Filter -->
                        <select id="filterRole"
                            class="border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">

                            <option value="all">All Roles</option>
                            <!-- <option value="Admin">Admin</option> -->
                            <option value="User">User</option>

                        </select>

                        <!-- Status Filter -->
                        <select id="filterStatus"
                            class="border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">

                            <option value="all">All Status</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>

                        </select>

                        <!-- Sort -->
                        <select id="sortUsers"
                            class="border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">

                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="name-asc">Name A-Z</option>
                            <option value="name-desc">Name Z-A</option>

                        </select>

                        <!-- Add User Button -->
                        <a href="adduser.html"
                            class="bg-blue-600 text-white px-5 py-2.5 rounded-lg text-center hover:bg-blue-700 transition duration-300 flex items-center justify-center gap-2 whitespace-nowrap">

                            <i class="fa-solid fa-plus"></i>
                            Add User
                        </a>
                        
                    </div>


                </div>


                <!-- Users Table -->
                <div class="overflow-x-auto">

                    <table class="w-full text-left">

                        <!-- Table Heading -->
                        <thead class="bg-gray-50 text-gray-600 text-sm">

                            <tr>

                                <th class="px-6 py-4 font-semibold">ID</th>

                                <th class="px-6 py-4 font-semibold">Name</th>

                                <th class="px-6 py-4 font-semibold">Email</th>

                                <th class="px-6 py-4 font-semibold">Role</th>

                                <th class="px-6 py-4 font-semibold">Status</th>

                                <th class="px-6 py-4 font-semibold text-center">Actions</th>

                            </tr>

                        </thead>


                        <!-- Table Body -->
                        <tbody id="userTableBody" class="text-sm text-gray-700">

                        </tbody>

                    </table>
                    <!-- Pagination -->
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 p-5 border-t border-gray-200">

                        <!-- Page Information -->
                        <p id="paginationInfo" class="text-sm text-gray-500">
                            Showing 0 to 0 of 0 users
                        </p>

                        <!-- Pagination Buttons -->
                        <div class="flex items-center gap-2">

                            <button id="prevPage"
                                class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-600 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed">
                                Previous
                            </button>

                            <div id="pageNumbers" class="flex items-center gap-1">
                            </div>

                            <button id="nextPage"
                                class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-600 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed">
                                Next
                            </button>
                        </div>
                    </div>

                </div>


                <!-- Table Footer -->
                <!-- <div class="p-5 border-t border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-3">

                    <p id="userCount" class="text-sm text-gray-500">
                        Showing 0 users
                    </p>

                    <div class="flex gap-2">

                        <button class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-500 hover:bg-gray-100 transition">
                            Previous
                        </button>

                        <button class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">
                            1
                        </button>

                        <button class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-500 hover:bg-gray-100 transition">
                            Next
                        </button>

                    </div>

                </div> -->

            </section>

        </main>

    </div>


<!-- Edit User Modal -->
<div id="editUserModal"
    class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg rounded-lg shadow-xl p-6">

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold text-gray-800">
                Edit User
            </h2>

            <button type="button"
                onclick="closeEditModal()"
                class="text-gray-500 hover:text-red-600 text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="editUserForm" class="space-y-4">

            <input type="hidden" id="editUserId">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Full Name
                </label>
                <input type="text" id="editUserName" required
                    class="w-full border border-gray-300 rounded-md px-4 py-2 outline-none focus:border-blue-600">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Email
                </label>
                <input type="email" id="editUserEmail" required
                    class="w-full border border-gray-300 rounded-md px-4 py-2 outline-none focus:border-blue-600">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Role
                </label>
                <select id="editUserRole"
                    class="w-full border border-gray-300 rounded-md px-4 py-2 outline-none focus:border-blue-600">
                    <option value="Admin">Admin</option>
                    <option value="User">User</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Account Status
                </label>
                <select id="editUserStatus"
                    class="w-full border border-gray-300 rounded-md px-4 py-2 outline-none focus:border-blue-600">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

            <div class="flex justify-end gap-3 pt-4">
                <button type="button"
                    onclick="closeEditModal()"
                    class="px-5 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-100">
                    Cancel
                </button>

                <button type="submit"
                    class="px-5 py-2 bg-blue-700 text-white rounded-md hover:bg-blue-800 transition">
                    Update User
                </button>
            </div>

        </form>
    </div>
</div>


    <script src="script.js"></script>
    <script src="auth.js"></script>
    <script>
        if (!checkPageAccess("Admin")) {
            document.body.style.display = "none";
        }
    </script>

</body>
</html>
