<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4 py-8">

    <!-- registration container -->
    <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-sm border border-gray-200">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-xl flex items-center 
                    justify-center mx-auto mb-4">
                <i class="fa-solid fa-user-plus text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">
                Create account
            </h1>
            <p class="text-gray-500 text-sm mt-2">
                SIgn up to get started
            </p>
        </div>
        <!-- Registration Form -->
        <form id="registerForm" class="space-y-5">
            <!-- Full Name -->
            <div>
                <label for="registerName"
                        class="block text-sm font-medium text-gray-700 mb-2">
                    Full Name
                </label>
                <input type="text"
                        id="registerName"
                        placeholder="Enter yout full name"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 
                        focus:ring-blue-500 focus:border-blue-500 transition">
            </div>
            <!-- emial -->
            <div>
                <label for="registerEmail"
                    class="block text-sm font-medium text-gray-700 mb-2">
                    Email Address
                </label>
                <input type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 
                            focus:outline-none
                            focus:ring-blue-500
                            focus:border-blue-500 transition">
            </div>
            <!-- password -->
            <div>
                <label for="registerPassword"
                    class="block text-sm font-medium text-gray 700 mb-2">
                    Password                
                </label>
                <input type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="6"
                        maxlength="12"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2
                                focus:ring-blue-500 focus:border-blue-500 transition">
            </div>
            <!-- confirm password -->
            <div>
                <label for="confirmPassword" 
                        class="block text-sm font-medium text-gray-700 mb-2">
                        Confirm Password
                </label>
                <input type="password" id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none
                                focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <!-- Error or the sucess message -->
            <p id="registerMessage" class="text-sm hidden">
            </p>
            <!-- Register Button -->
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 
                    text-white font-semibold py-3
                    runded-lg transition duration-200">
                    Create Account
            </button>
        </form>
        <!-- Login Link -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-600">
                Already have an account?
                <a href="login.html"
                    class="text-blue-600 font-semibold
                            hoverunderline">
                        Login
                </a>
            </p>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
