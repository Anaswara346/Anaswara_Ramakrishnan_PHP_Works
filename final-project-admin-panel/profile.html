
<!DOCTYPE html>
<html lang="en" class="overscroll-none">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Admin Panel</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-100">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <aside id="sidebar"
            class="fixed lg:static top-0 left-0 z-50 bg-gray-800
            text-white min-h-screen transition-transform duration-300
            -translate-x-full lg:translate-x-0 w-64">

            <div class="p-6 flex items-center justify-between">
                <h1 class="text-white font-semibold text-2xl">
                    Admin Panel
                </h1>

                <button id="closeSidebar" class="lg:hidden text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="px-3 space-y-2 mt-6">

                <a href="dashboard.html"
                    class="block px-4 py-3 text-white hover:bg-gray-600 rounded-lg transition">
                    <i class="fa-solid fa-house w-5"></i>
                    Dashboard
                </a>

                <a href="users.html"
                    class="block px-4 py-3 text-white hover:bg-gray-600 rounded-lg transition">
                    <i class="fa-solid fa-users w-5"></i>
                    Users
                </a>

                <a href="adduser.html"
                    class="block px-4 py-3 text-white hover:bg-gray-600 rounded-lg transition">
                    <i class="fa-solid fa-user-plus w-5"></i>
                    Add User
                </a>

                <a href="profile.html"
                    class="block px-4 py-3 bg-blue-600 rounded-lg">
                    <i class="fa-solid fa-user-circle w-5"></i>
                    My Profile
                </a>
                <a href="#" id="logoutBtn"
                    class="block px-4 py-3 text-white hover:bg-red-600 rounded-lg transition">
                    <i class="fa-solid fa-right-from-bracket w-5"></i>
                    Logout
                </a>

            </nav>

        </aside>


        <!-- Main Content -->
        <main class="p-6 flex-1">

            <!-- Header -->
            <header class="p-4 bg-white rounded-lg shadow-sm mb-6 flex items-center gap-4">

                <button id="openSidebar"
                    class="lg:hidden text-gray-700 text-xl">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <h2 class="text-2xl font-semibold text-gray-700">
                    My Profile
                </h2>

            </header>


            <!-- Profile Heading -->
            <section class="mb-6">

                <h3 class="text-lg font-semibold text-gray-700">
                    Administrator Profile
                </h3>

                <p class="text-sm text-gray-500 mt-1">
                    View and manage your account information.
                </p>

            </section>


            <!-- Profile Card -->
            <section class="bg-white border border-gray-200 rounded-lg shadow-sm max-w-4xl">

                <!-- Profile Header -->
                <div class="p-6 border-b border-gray-200 flex items-center gap-5">

                    <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full
                        flex items-center justify-center text-3xl">

                        <i class="fa-solid fa-user"></i>

                    </div>

                    <div>
                        <h3 id="profileDisplayName"
                            class="text-xl font-semibold text-gray-800">
                            Loading...
                        </h3>

                        <p class="text-sm text-gray-500 mt-1">
                            Administrator
                        </p>
                    </div>

                </div>


                <!-- Profile Details -->
                <div class="p-6">

                    <h3 class="text-gray-700 font-semibold mb-6">
                        Personal Information
                    </h3>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-7">

                        <!-- Name -->
                        <div>
                            <label class="text-sm text-gray-500">
                                Full Name
                            </label>

                            <p id="profileName"
                                class="text-gray-800 font-medium mt-2">
                                -
                            </p>
                        </div>


                        <!-- Email -->
                        <div>
                            <label class="text-sm text-gray-500">
                                Email Address
                            </label>

                            <p id="profileEmail"
                                class="text-gray-800 font-medium mt-2">
                                -
                            </p>
                        </div>


                        <!-- Role -->
                        <div>
                            <label class="text-sm text-gray-500">
                                Account Role
                            </label>

                            <p id="profileRole"
                                class="text-gray-800 font-medium mt-2">
                                -
                            </p>
                        </div>


                        <!-- Status -->
                        <div>
                            <label class="text-sm text-gray-500">
                                Account Status
                            </label>

                            <p id="profileStatus"
                                class="text-green-600 font-medium mt-2">
                                -
                            </p>
                        </div>

                    </div>


                    <!-- Action -->
                    <div class="border-t border-gray-200 mt-8 pt-6">

                        <button id="editProfileBtn"
                            class="bg-blue-600 hover:bg-blue-700 text-white
                            px-5 py-2.5 rounded-lg transition">

                            <i class="fa-solid fa-pen mr-2"></i>
                            Edit Profile
                        </button>
                    </div>
                    
                    <!-- Edit Profile Modal -->
                    <div id="editProfileModal"
                        class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">

                        <div class="bg-white w-full max-w-lg rounded-xl shadow-xl">

                            <!-- Modal Header -->
                            <div class="flex items-center justify-between p-6 border-b border-gray-200">

                                <h3 class="text-xl font-semibold text-gray-800">
                                    Edit Profile
                                </h3>

                                <button id="closeProfileModal"
                                    class="text-gray-500 hover:text-gray-800 text-xl">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>

                            </div>
                            <form id="editProfileForm" class="p-6">

                                <!-- Name -->
                                <div class="mb-5">
                                    <label for="editProfileName"
                                        class="block text-sm font-medium text-gray-600 mb-2">
                                        Full Name
                                    </label>

                                    <input type="text"
                                        id="editProfileName"
                                        required
                                        class="w-full border border-gray-300 rounded-lg px-4 py-3
                                        focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>

                                <!-- Email -->
                                <div class="mb-5">
                                    <label for="editProfileEmail"
                                        class="block text-sm font-medium text-gray-600 mb-2">
                                        Email Address
                                    </label>

                                    <input type="email"
                                        id="editProfileEmail"
                                        required
                                        class="w-full border border-gray-300 rounded-lg px-4 py-3
                                        focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>

                                <p id="profileEditError"
                                    class="hidden text-red-600 text-sm mt-2 mb-4">
                                </p>
                                <div class="flex justify-end gap-3">
                                    <button type="button"
                                        id="cancelProfileEdit"
                                        class="px-5 py-2.5 border border-gray-300 rounded-lg
                                        text-gray-600 hover:bg-gray-50">
                                        Cancel
                                    </button>

                                    <button type="submit"
                                        class="px-5 py-2.5 bg-blue-600 text-white rounded-lg
                                        hover:bg-blue-700">
                                        Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </section>

        </main>

    </div>
    <!-- Success Toast -->
    <div id="successToast"
        class="hidden fixed top-5 right-5 z-50 bg-green-600 text-white px-5 py-3 rounded-lg shadow-lg flex items-center gap-3">

        <i class="fa-solid fa-circle-check"></i>

        <span id="successToastMessage">
            Profile updated successfully!
        </span>

    </div>
    <script src="script.js"></script>
    <script src="auth.js"></script>

    <script>
     const currentUser = JSON.parse(
        localStorage.getItem("currentUser")
        );
        if (!checkPageAccess("Admin")) {

            document.body.style.display = "none";

        } else {

        
            // Display profile details
            document.getElementById("profileDisplayName").textContent = currentUser.name;

            document.getElementById("profileName").textContent = currentUser.name;

            document.getElementById("profileEmail").textContent = currentUser.email;

            document.getElementById("profileRole").textContent = currentUser.role;

            document.getElementById("profileStatus").textContent = currentUser.status;

        }
      

    </script>

</body>
</html>
